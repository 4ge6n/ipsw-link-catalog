name: Update IPSW catalog
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', 'schemas/**', 'tests/**', 'config.json', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: ipsw-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: tests
        run: python -m unittest discover -s tests
        continue-on-error: true
      - id: catalog
        run: python scripts/update.py
        if: github.event_name != 'push' && steps.tests.outcome == 'success'
        continue-on-error: true
      - name: Publish update status
        if: always() && github.event_name != 'push'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            python scripts/update_status.py --state failure --failed-step tests --run-url "$RUN_URL"
          elif [ "$CATALOG_OUTCOME" != "success" ]; then
            python scripts/update_status.py --state failure --failed-step catalog-update --run-url "$RUN_URL"
          else
            python scripts/update_status.py --state success --run-url "$RUN_URL"
          fi
      - name: Commit changed catalog
        if: always() && github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api README.md
          git diff --cached --quiet || git commit -m "data: update IPSW catalog ($(date -u +%F))"
          git push
      - name: Fail the workflow when an update failed
        if: always() && github.event_name != 'push' && (steps.tests.outcome != 'success' || steps.catalog.outcome != 'success')
        run: exit 1
