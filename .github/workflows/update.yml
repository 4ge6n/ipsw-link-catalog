name: Update IPSW catalog
on:
  workflow_dispatch:
    inputs:
      full_beta_history:
        description: 'Re-scan every historical IPSWBeta.dev track (slow; normally unnecessary)'
        required: false
        default: false
        type: boolean
  # The Cloudflare relay dispatches within minutes of a feed change; this
  # schedule is the fallback for when the relay itself is not running.
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [firmware_release]
  push:
    paths: ['scripts/**', 'schemas/**', 'tests/**', 'config.json', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ipsw-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests
      - id: catalog
        run: |
          output="$(python scripts/update.py)"
          printf '%s\n' "$output"
          summary="$(printf '%s\n' "$output" | tail -n 1)"
          python - "$summary" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          print(f"new_firmware_urls={json.loads(sys.argv[1]).get('new_firmware_urls', 0)}")
          PY
        env:
          BETA_HISTORY: ${{ inputs.full_beta_history == true && '1' || '0' }}
        if: github.event_name != 'push'
      - name: Send web push for new links
        if: github.event_name != 'push' && steps.catalog.outputs.new_firmware_urls != '0'
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          npm ci --prefix push-sender
          node push-sender/send.mjs
      - name: Commit changed catalog
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Every run rewrites its own timestamps, so compare the catalog build
          # instead: on the schedule most runs find nothing and must not commit.
          before="$(git show HEAD:site/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          after="$(python -c 'import json; print(json.load(open("site/version.json"))["build"])')"
          if [ "$before" = "$after" ]; then
            git checkout -- api site README.md
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged ($after)."
          else
            git add api site README.md
            git commit -m "data: update IPSW catalog ($(date -u +%F))"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Catalog changed: $before -> $after"
          fi
      # On the schedule most runs find nothing, so only redeploy real changes.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with: {path: site}
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
