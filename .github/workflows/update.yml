name: Update IPSW catalog
on:
  schedule:
    # GitHub Actions schedules are best-effort, but this is the smallest
    # supported polling interval for public firmware sources.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [firmware_release]
  push:
    paths: ['scripts/**', 'schemas/**', 'tests/**', 'config.json', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ipsw-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests
      - run: python scripts/update.py
        if: github.event_name != 'push'
      - name: Commit changed catalog
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api site README.md
          git diff --cached --quiet || git commit -m "data: update IPSW catalog ($(date -u +%F))"
          git push
      - uses: actions/configure-pages@v5
        if: github.event_name != 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'push'
        with: {path: site}
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'push'
