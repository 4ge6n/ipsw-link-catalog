name: Update IPSW catalog
on:
  workflow_dispatch:
    inputs:
      full_beta_history:
        description: 'Re-scan every historical IPSWBeta.dev track (slow; normally unnecessary)'
        required: false
        default: false
        type: boolean
      test_push:
        description: 'Send a test notification to every subscriber, whether or not links changed'
        required: false
        default: false
        type: boolean
  # The Cloudflare relay dispatches within minutes of a feed change; this
  # schedule is the fallback for when the relay itself is not running.
  # GitHub drops scheduled runs under load and the top of the hour is the
  # busiest slot, so these sit off the common minutes.
  schedule:
    - cron: '7,22,37,52 * * * *'
  repository_dispatch:
    types: [firmware_release]
  push:
    paths: ['assets/**', 'scripts/**', 'schemas/**', 'site/**', 'tests/**', 'config.json', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
  # The relay check reports by opening one issue rather than by painting
  # every run of the day red.
  issues: write
concurrency:
  group: ipsw-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests
      - id: catalog
        run: |
          output="$(python scripts/update.py)"
          printf '%s\n' "$output"
          summary="$(printf '%s\n' "$output" | tail -n 1)"
          python - "$summary" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          summary = json.loads(sys.argv[1])
          print(f"new_firmware_urls={summary.get('new_firmware_urls', 0)}")
          # One line, so it survives being a step output.
          print("new_builds=" + json.dumps(summary.get("new_builds", []), separators=(",", ":")))
          closed = summary.get("signing_closed", [])
          print(f"signing_closed_count={len(closed)}")
          print("signing_closed=" + json.dumps(closed, separators=(",", ":")))
          PY
        env:
          BETA_HISTORY: ${{ inputs.full_beta_history == true && '1' || '0' }}
        if: github.event_name != 'push'
      - name: Send notifications for new links
        if: github.event_name != 'push' && (steps.catalog.outputs.new_firmware_urls != '0' || steps.catalog.outputs.signing_closed_count != '0' || inputs.test_push)
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          # Absent until an APNs key is added; the sender then skips the phones
          # and still delivers to the browsers.
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          NEW_BUILDS: ${{ steps.catalog.outputs.new_builds }}
          SIGNING_CLOSED: ${{ steps.catalog.outputs.signing_closed }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
        run: |
          npm ci --prefix push-sender
          node push-sender/send.mjs
      - name: Commit changed catalog
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Every run rewrites its own timestamps, so compare the catalog build
          # instead: on the schedule most runs find nothing and must not commit.
          before="$(git show HEAD:site/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          after="$(python -c 'import json; print(json.load(open("site/version.json"))["build"])')"
          if [ "$before" = "$after" ]; then
            git checkout -- api site README.md
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged ($after)."
          else
            git add api site README.md
            git commit -m "data: update IPSW catalog ($(date -u +%F))"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Catalog changed: $before -> $after"
          fi
      # On the schedule most runs find nothing, so only redeploy real changes.
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        with: {path: site}
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'

      # The relay is what makes a notification arrive in the minute Apple
      # publishes rather than whenever GitHub next feels like running the
      # schedule. When GitHub refuses its dispatch the relay has nowhere to
      # say so: iOS 27.2 beta 2 went out, the relay saw it within the hour,
      # GitHub answered 403, and the first anyone knew was a notification
      # that never came. Checked last so a bad token cannot stop the catalog
      # being published, and loud so the next to hear about it is not the
      # person waiting for a push.
      - name: Check that the relay can still reach GitHub
        if: github.event_name != 'push'
        run: python3 scripts/check_relay.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
