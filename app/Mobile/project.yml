name: IPSWBrowser
options:
  bundleIdPrefix: com.github.4ge6n.ipsw-link-catalog
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  IPSWBrowser:
    type: application
    platform: iOS
    sources:
      # The catalog and the transfer engine are the Mac app's own files, built
      # straight into this target rather than copied or wrapped in a module.
      - path: ../IPSWSync/Sources/IPSWSync/Catalog.swift
      - path: ../IPSWSync/Sources/IPSWSync/SyncEngine.swift
      - path: ../IPSWSync/Sources/IPSWSync/SyncEngine+Files.swift
      - path: ../IPSWSync/Sources/IPSWSync/VerifiedStore.swift
      - path: Sources
      - path: ../IPSWSync/Localizations/en.lproj
        buildPhase: resources
      - path: ../IPSWSync/Localizations/ja.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.4ge6n.ipsw-link-catalog.IPSWBrowser
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: IPSW Browser
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Downloaded images land in the app's Documents folder, which the Files
        # app shows as a place of its own.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
